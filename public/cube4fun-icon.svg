<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cube4fun Analyzer icon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="224" height="224" rx="44" fill="#0f1419"/>
  <rect x="16" y="16" width="224" height="224" rx="44" fill="none" stroke="#243044" stroke-width="2"/>

  <!-- Isometric cube outline -->
  <g filter="url(#shadow)" stroke="url(#g)" stroke-width="10" stroke-linejoin="round" fill="none">
    <!-- top face -->
    <path d="M128 64 188 96 128 128 68 96 Z"/>
    <!-- left face -->
    <path d="M68 96 128 128 128 196 68 164 Z"/>
    <!-- right face -->
    <path d="M188 96 128 128 128 196 188 164 Z"/>

    <!-- inner grid hints (rubik feel) -->
    <path d="M98 80 158 112"/>
    <path d="M158 112 158 156"/>
    <path d="M98 80 98 124"/>
    <path d="M128 128 188 96"/>
    <path d="M128 128 68 96"/>
    <path d="M128 196 188 164"/>
    <path d="M128 196 68 164"/>
  </g>

  <!-- Trend arrow overlay -->
  <path
    d="M78 170c22-6 36-18 52-38 9-12 20-20 38-26"
    fill="none"
    stroke="#e6edf3"
    stroke-width="8"
    stroke-linecap="round"
  />
  <path
    d="M177 101l16 0-8 14z"
    fill="#e6edf3"
    opacity="0.95"
  />
</svg>

